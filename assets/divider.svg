<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Section divider"><title>Section divider</title><defs>
<linearGradient id="pc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".075"/><stop offset="1" stop-color="#fff" stop-opacity=".015"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<defs><linearGradient id="dl" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="22" x2="1200" y2="22" stroke="url(#dl)" stroke-width="1.5"/>
<g transform="translate(600 22)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#080B12" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow)">
<animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></rect></g>
<circle cy="22" r="3" fill="#22D3EE" filter="url(#glow)"><animate attributeName="cx" values="0;1200" dur="7s" repeatCount="indefinite"/></circle>
</svg>