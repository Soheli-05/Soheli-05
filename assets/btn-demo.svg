<svg xmlns="http://www.w3.org/2000/svg" width="200" height="52" viewBox="0 0 200 52" role="img" aria-label="Live demo"><title>Live demo</title><defs>
<linearGradient id="pc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".075"/><stop offset="1" stop-color="#fff" stop-opacity=".015"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="198" height="50" rx="25" fill="#101522" stroke="url(#pc)" stroke-width="1.6"/>
<circle cx="30" cy="26" r="5" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="50" y="32" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="16" fill="#F8FAFC">Live demo</text></svg>